<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!-- Tables are to arrange data in rows and columns
     column - Vertical
     Row - horizontal
     th - table head
     tr - table row
     td - table data  -->
     <table border="7">
        <th>S/N</th>
        <th>Names </th>
        <th>Account balance</th>
        <th>Universities</th>

        <tr>
            <td>1</td>
            <td>David</td>
            <td>$10,000000</td>
            <td>Bowen</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Seun</td>
            <td>$20,000000</td>
            <td>Bowen</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Tolu</td>
            <td>$30,000000</td>
            <td>Bowen</td>
        </tr>
     </table>
</body>
</html>
